<svg viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#107C10"/>
    </marker>
    <marker id="arrRed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#C4314B"/>
    </marker>
    <marker id="arrGray" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8A8886"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="640" y="40" text-anchor="middle" font-size="29" font-weight="700" fill="#201F1E">A Private Endpoint never carries data</text>
  <text x="640" y="72" text-anchor="middle" font-size="16" fill="#605E5C">Both PEs live in one local subnet — yet latency tracks the storage account's real region, not the PE's</text>

  <!-- ================= Region A band ================= -->
  <rect x="40" y="100" width="770" height="470" rx="14" fill="#EAF3FB" stroke="#0078D4" stroke-width="2"/>
  <text x="60" y="126" font-size="16" font-weight="700" fill="#0078D4">REGION A · Australia East ("near")</text>

  <!-- VNet -->
  <rect x="66" y="140" width="410" height="415" rx="10" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5" stroke-dasharray="5,3"/>
  <text x="84" y="164" font-size="14" font-weight="600" fill="#323130">VNet  10.20.0.0/16</text>

  <!-- client subnet -->
  <rect x="86" y="178" width="372" height="120" rx="7" fill="#F3F9FD" stroke="#2B88D8" stroke-width="1"/>
  <text x="100" y="199" font-size="12" fill="#605E5C">snet-client  10.20.1.0/24</text>
  <rect x="108" y="212" width="210" height="70" rx="6" fill="#FFFFFF" stroke="#0078D4" stroke-width="1.5"/>
  <text x="213" y="241" text-anchor="middle" font-size="15" font-weight="700" fill="#201F1E">vm-client</text>
  <text x="213" y="263" text-anchor="middle" font-size="12" fill="#605E5C">Ubuntu + mtr</text>

  <!-- pe subnet -->
  <rect x="86" y="330" width="372" height="210" rx="7" fill="#F3F9FD" stroke="#2B88D8" stroke-width="1"/>
  <text x="100" y="351" font-size="12" fill="#605E5C">snet-pe  10.20.2.0/24</text>
  <rect x="106" y="364" width="332" height="70" rx="6" fill="#EBF6EB" stroke="#107C10" stroke-width="1.5"/>
  <text x="122" y="392" font-size="14" font-weight="700" fill="#0B5A0B">pe-near-blob</text>
  <text x="122" y="414" font-size="12" fill="#605E5C">NIC 10.20.2.4  →  NEAR storage</text>
  <rect x="106" y="452" width="332" height="70" rx="6" fill="#FBEAEA" stroke="#C4314B" stroke-width="1.5"/>
  <text x="122" y="480" font-size="14" font-weight="700" fill="#A4262C">pe-far-blob</text>
  <text x="122" y="502" font-size="12" fill="#605E5C">NIC 10.20.2.5  →  FAR storage</text>

  <!-- NEAR storage (Region A) -->
  <rect x="560" y="200" width="220" height="94" rx="10" fill="#FFFFFF" stroke="#107C10" stroke-width="2"/>
  <text x="670" y="232" text-anchor="middle" font-size="15" font-weight="700" fill="#0B5A0B">NEAR storage</text>
  <text x="670" y="256" text-anchor="middle" font-size="12" fill="#605E5C">Blob · Region A</text>
  <text x="670" y="280" text-anchor="middle" font-size="13" font-weight="700" fill="#107C10">~3 ms</text>

  <!-- ================= Region B band ================= -->
  <rect x="850" y="350" width="390" height="220" rx="14" fill="#FBEAEA" stroke="#C4314B" stroke-width="2"/>
  <text x="868" y="376" font-size="16" font-weight="700" fill="#A4262C">REGION B · Germany West Central ("far")</text>
  <rect x="900" y="408" width="300" height="104" rx="10" fill="#FFFFFF" stroke="#C4314B" stroke-width="2"/>
  <text x="1050" y="444" text-anchor="middle" font-size="15" font-weight="700" fill="#A4262C">FAR storage</text>
  <text x="1050" y="468" text-anchor="middle" font-size="12" fill="#605E5C">Blob · Region B</text>
  <text x="1050" y="492" text-anchor="middle" font-size="13" font-weight="700" fill="#C4314B">~240 ms</text>

  <!-- ================= Control plane (dashed gray) ================= -->
  <path d="M 400 360 L 400 300" fill="none" stroke="#8A8886" stroke-width="2" stroke-dasharray="6,4" marker-end="url(#arrGray)"/>
  <text x="412" y="326" font-size="11.5" font-style="italic" fill="#605E5C">control plane:</text>
  <text x="412" y="342" font-size="11.5" font-style="italic" fill="#605E5C">/32 route + DNS</text>

  <!-- ================= Data plane NEAR (green) ================= -->
  <path d="M 320 248 C 430 232, 480 232, 556 246" fill="none" stroke="#107C10" stroke-width="3" marker-end="url(#arrGreen)"/>
  <text x="438" y="224" text-anchor="middle" font-size="13" font-weight="700" fill="#107C10">data plane · ~3 ms</text>

  <!-- Microsoft backbone pill -->
  <rect x="548" y="362" width="250" height="34" rx="17" fill="#FFF4CE" stroke="#D9B100" stroke-width="1.2"/>
  <text x="673" y="384" text-anchor="middle" font-size="13" font-weight="600" fill="#7A5C00">Microsoft global backbone</text>

  <!-- ================= Data plane FAR (red) ================= -->
  <path d="M 320 270 C 470 320, 470 430, 660 430 C 800 430, 820 455, 896 458" fill="none" stroke="#C4314B" stroke-width="3" marker-end="url(#arrRed)"/>
  <text x="660" y="338" text-anchor="middle" font-size="13" font-weight="700" fill="#C4314B">data plane · ~240 ms (real region distance)</text>

  <!-- ================= Legend ================= -->
  <rect x="40" y="586" width="1200" height="110" rx="10" fill="#FAF9F8" stroke="#D2D0CE" stroke-width="1"/>
  <line x1="64" y1="612" x2="104" y2="612" stroke="#107C10" stroke-width="3"/>
  <text x="116" y="617" font-size="13.5" fill="#323130">Data plane — client NIC straight to the storage account over Microsoft's backbone. It never touches the private endpoint.</text>
  <line x1="64" y1="640" x2="104" y2="640" stroke="#8A8886" stroke-width="2.5" stroke-dasharray="6,4"/>
  <text x="116" y="645" font-size="13.5" fill="#323130">Control plane — all the PE does: inject a /32 route (next-hop InterfaceEndpoint) and a DNS A-record into local NICs.</text>
  <text x="64" y="678" font-size="14" font-weight="700" fill="#A4262C">Both FQDNs resolve to local 10.20.2.x — DNS can't tell them apart. The ~80× latency gap is pure geography ⇒ the PE is a shim, not a hop.</text>
</svg>
