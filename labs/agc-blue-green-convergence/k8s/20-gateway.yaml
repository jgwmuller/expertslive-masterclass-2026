# ----------------------------------------------------------------------------
# Gateway — the digital twin of the AGC frontend.
#
# In MANAGED mode the Gateway points at the ApplicationLoadBalancer by name via
# annotations (alb-namespace + alb-name), NOT by an alb-id ARM resource ID
# (that's the BYO-mode style). The ALB controller programs an Azure-managed
# public frontend and hands back an *.alb.azure.com FQDN in
# status.addresses[0].value once the listener is Programmed.
#
# GatewayClass is always `azure-alb-external` today — AGC only supports public
# frontends.
# ----------------------------------------------------------------------------
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: gateway-01
  namespace: test-infra
  annotations:
    alb.networking.azure.io/alb-namespace: alb-test-infra
    alb.networking.azure.io/alb-name: alb-test
spec:
  gatewayClassName: azure-alb-external
  listeners:
    - name: http
      port: 80
      protocol: HTTP
      allowedRoutes:
        namespaces:
          from: Same
