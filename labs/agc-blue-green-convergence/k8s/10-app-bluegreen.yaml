# ----------------------------------------------------------------------------
# Blue/green sample app for the convergence demo.
#
# Two deployments + two services in the `test-infra` namespace:
#   backend-v1  -> TITLE "BLUE  (backend-v1)"   = the ACTIVE service  (weight 999)
#   backend-v2  -> TITLE "GREEN (backend-v2)"   = the STANDBY service (weight 1)
#
# Both run the same MCR-hosted aks-helloworld image (reliable to pull on stage);
# they differ only by the TITLE env var, which appears in the HTML body so the
# hammer script can tell which backend served each request by grepping BLUE/GREEN.
#
# The app listens on port 80 and answers 200 on "/", so AGC's default health
# probe (GET /) works with no HealthCheckPolicy.
# ----------------------------------------------------------------------------
apiVersion: v1
kind: Namespace
metadata:
  name: test-infra
---
# ===== BLUE — backend-v1 (active) ===========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v1
  namespace: test-infra
  labels:
    app: backend-v1
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-v1
  template:
    metadata:
      labels:
        app: backend-v1
    spec:
      containers:
        - name: backend-v1
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "BLUE (backend-v1)"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v1
  namespace: test-infra
spec:
  selector:
    app: backend-v1
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---
# ===== GREEN — backend-v2 (standby) =========================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-v2
  namespace: test-infra
  labels:
    app: backend-v2
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-v2
  template:
    metadata:
      labels:
        app: backend-v2
    spec:
      containers:
        - name: backend-v2
          image: mcr.microsoft.com/azuredocs/aks-helloworld:v1
          ports:
            - containerPort: 80
          env:
            - name: TITLE
              value: "GREEN (backend-v2)"
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: backend-v2
  namespace: test-infra
spec:
  selector:
    app: backend-v2
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
